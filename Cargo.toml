[package]
name = "telegram-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A simple and powerful CLI tool to interact with the Telegram Bot API."
authors = ["1ffycat <1ffycatx@gmail.com>"]
license = "MPL-2.0"
repository = "https://github.com/1ffycat/telegram-cli"
readme = "README.md"
keywords = ["telegram", "cli", "bot", "api", "tool"]
categories = ["command-line-utilities", "api-bindings"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form", "multipart", "stream", "socks", "system-proxy"] }
anyhow = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dirs = "7.0"
glob = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
